name: Naborforce
description: >-
  Naborforce is an on-demand home care and companionship platform that connects older adults with
  vetted, friendly local helpers called "Nabors" for non-medical assistance such as errands, rides
  to appointments, meal preparation, light housekeeping, technology help, and social companionship.
  Families and older adults book help on demand through the Naborforce website and iOS/Android apps
  on a pay-as-you-go basis with no long-term contracts. Naborforce is a Techstars-backed company and
  was added to the API Evangelist network as a company profile. As of this enrichment pass Naborforce
  operates as a consumer-facing (B2C) service and publishes no public developer API, developer portal,
  OpenAPI specification, SDKs, or technical integration surface.
